nd:#1e1713aa}.modal-head{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.5rem;border-bottom:1px solid #e6ded5;z-index:1}.modal-head h2{margin:0;color:#8d3026;font-family:serif;font-size:1.45rem}.close{border:0;background:transparent;font-size:1.7rem;line-height:1;cursor:pointer;padding:.2rem .5rem}.modal-body{padding:1.3rem 1.5rem 1.6rem}.notice{font-size:.92rem;line-height:1.7;background:#f7f2eb;border-left:3px solid #a34d36;padding:.8rem 1rem;margin:0 0 1.2rem}.fields{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.field{display:flex;flex-direction:column;gap:.4rem}.wide{grid-column:1/-1}label{font-size:.9rem;font-weight:700}input,select,textarea{width:100%;padding:.75rem;border:1px solid #bdb2a6;border-radius:7px;background:white;font:1rem inherit;color:#352b26}textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:flex-end;margin-top:1.2rem}.review{background:#f7f2eb;border-radius:10px;padding:1rem;line-height:1.7;white-space:pre-wrap}.review-actions{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1rem}.secondary{background:#eee6dc;color:#352b26;box-shadow:none}.secondary:hover{background:#ded2c4}@media(max-width:700px){section[id],#spots{scroll-margin-top:40px}.nav{height:52px;aspect-ratio:auto;overflow:visible;box-shadow:0 2px 8px #0002}.nav-image,.nav>.hotspot{display:none}.nav-mobile{display:flex;align-items:center;justify-content:space-between;gap:.15rem;height:100%;padding:0 .35rem;background:#fffaf3}.nav-mobile a,.nav-mobile button{color:#63251f;text-decoration:none;font-size:.67rem;font-weight:bold;white-space:nowrap;border:0;background:none;padding:.75rem .15rem;cursor:pointer}.nav-mobile button{color:white;background:#8d3026;border-radius:999px;padding:.55rem .45rem}.cover-link{top:1%;height:5%}.cover-card{top:83%;height:13%}.section-cta,.plan-cta{min-height:44px}.mobile-caption{display:block;text-align:center;padding:1rem 1rem 1.4rem;line-height:1.6;background:#fffdf8}.mobile-caption h2{font-family:serif;color:#8d3026;font-size:1.25rem;margin:0 0 .35rem}.mobile-caption p{margin:0;font-size:.9rem}.fields{grid-template-columns:1fr}.modal-body{padding:1rem}}
</style></head><body><div class="shell"><header class="nav" aria-label="固定メニュー"><img class="nav-image" src="01_表紙.png" alt="" aria-hidden="true"><a class="hotspot cover-link" href="#course" style="left:27%;width:11%" aria-label="モデルコースへ移動"></a><a class="hotspot cover-link" href="#spots" style="left:39%;width:12%" aria-label="おすすめスポットへ移動"></a><a class="hotspot cover-link" href="#food" style="left:52%;width:7%" aria-label="グルメへ移動"></a><a class="hotspot cover-link" href="#stay" style="left:60%;width:7%" aria-label="宿泊へ移動"></a><a class="hotspot cover-link" href="#access" style="left:68%;width:8%" aria-label="アクセスへ移動"></a><button class="hotspot cover-link" style="left:78%;width:19%;border:0;background:transparent;cursor:pointer" type="button" data-open aria-label="予約フォームを開く"></button><nav class="nav-mobile" aria-label="ページ内メニュー"><a href="#top">金沢旅</a><a href="#course">モデルコース</a><a href="#spots">スポット</a><a href="#food">グルメ</a><a href="#stay">宿泊</a><a href="#access">アクセス</a><button type="button" data-open>ご予約</button></nav></header><main>
<section class="panel" id="top" aria-label="週末、金沢へ"><img src="01_表紙.png" alt="週末、金沢へ。町並み、庭園、食、宿の旅のイメージ" fetchpriority="high"><a class="hotspot cover-card" href="#course" style="left:4%;width:18%" aria-label="モデルコースへ移動"></a><a class="hotspot cover-card" href="#spots" style="left:23%;width:18%" aria-label="おすすめスポットへ移動"></a><a class="hotspot cover-card" href="#food" style="left:42%;width:18%" aria-label="グルメへ移動"></a><a class="hotspot cover-card" href="#stay" style="left:61%;width:18%" aria-label="宿泊へ移動"></a><a class="hotspot cover-card" href="#access" style="left:80%;width:18%" aria-label="アクセスへ移動"></a></section>
<section class="panel" id="course" aria-label="金沢モデルコース"><img src="02_モデルコース.png" alt="金沢を巡る二泊三日のモデルコース。庭園、歴史ある町並み、美術館など" loading="lazy"><span id="spots" style="position:absolute;top:22%;left:0" aria-hidden="true"></span><a class="hotspot section-cta" href="#plans" aria-label="宿泊プランを見る"></a><div class="mobile-caption"><h2>金沢を巡る</h2><p>街歩きと文化、季節の風景を楽しむモデルコース。</p></div></section>
<section class="panel" id="food" aria-label="金沢の美食めぐり"><img src="03_グルメ.png" alt="金沢の美食めぐり。海鮮、和食、和菓子やカフェのイメージ" loading="lazy"><div class="mobile-caption"><h2>金沢の美食めぐり</h2><p>土地の味を楽しむ旅のひととき。</p></div></section>
<section class="panel" id="stay" aria-label="金沢で泊まる"><img src="04_宿泊.png" alt="金沢で泊まる。庭を望む客室やくつろぎの空間のイメージ" loading="lazy"><a class="hotspot section-cta" href="#plans" aria-label="宿泊プランを見る"></a><div class="mobile-caption"><h2>金沢で泊まる</h2><p>旅の余韻に浸る、落ち着いた宿のイメージ。</p></div></section>
<section class="panel" id="access" aria-label="金沢へのアクセス"><img src="05_アクセス.png" alt="金沢へのアクセス。金沢駅と交通手段の紹介イメージ" loading="lazy"><a class="hotspot section-cta" href="#plans" aria-label="宿泊プランを見る"></a><div class="mobile-caption"><h2>金沢へのアクセス</h2><p>旅の行き方と市内の移動を確認。</p></div></section>
<section class="panel" id="plans" aria-label="宿泊プラン"><img src="06_宿泊プラン.png" alt="金沢旅の宿泊プラン。客室と食事の紹介イメージ" loading="lazy"><button class="hotspot plan-cta" style="border:0;background:transparent;cursor:pointer" type="button" data-open aria-label="宿泊プランを予約する"></button></section>
</main><footer class="footer"><a class="back-top" href="#top">↑ TOPへ</a><br>金沢旅 ｜ ポートフォリオ用の旅行LP<br>掲載画像内の宿泊・価格・交通情報はイメージです。実際の予約は受け付けていません。</footer></div>
<dialog id="reservation" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">旅の予約フォーム</h2><button class="close" type="button" id="close" aria-label="閉じる">×</button></div><div class="modal-body"><p class="notice">このページは作品見本です。入力と内容確認を試せますが、予約の送信・確定はされません。</p><form id="form"><div class="fields"><div class="field wide"><label for="plan">宿泊プラン</label><select id="plan" name="plan" required><option value="">選択してください</option><option>スタンダード和室プラン</option><option>和モダンツインプラン</option><option>露天風呂付き特別プラン</option></select></div><div class="field"><label for="checkin">チェックイン希望日</label><input id="checkin" name="checkin" type="date" required></div><div class="field"><label for="nights">宿泊日数</label><select id="nights" name="nights" required><option value="1泊">1泊</option><option value="2泊">2泊</option><option value="3泊">3泊</option></select></div><div class="field"><label for="adults">大人</label><input id="adults" name="adults" type="number" min="1" max="10" value="2" required></div><div class="field"><label for="children">子ども</label><input id="children" name="children" type="number" min="0" max="10" value="0" required></div><div class="field"><label for="guest">お名前</label><input id="guest" name="guest" type="text" autocomplete="name" required></div><div class="field"><label for="email">メールアドレス</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field wide"><label for="message">ご希望・ご質問（任意）</label><textarea id="message" name="message"></textarea></div></div><div class="actions"><button class="button" type="submit">入力内容を確認</button></div></form><div id="result" hidden><div class="review" id="review"></div><div class="review-actions"><button class="button secondary" type="button" id="edit">入力を修正</button><button class="button" type="button" id="done">閉じる</button></div></div></div></dialog>
<script>
const modal=document.querySelector('#reservation'),form=document.querySelector('#form'),result=document.querySelector('#result');
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>modal.showModal()));
document.querySelector('#close').addEventListener('click',()=>modal.close());document.querySelector('#done').addEventListener('click',()=>modal.close());
modal.addEventListener('click',event=>{if(event.target===modal)modal.close()});
form.addEventListener('submit',event=>{event.preventDefault();if(!form.reportValidity())return;const d=new FormData(form);document.querySelector('#review').textContent=`入力内容の確認（予約は確定していません）\n\n希望プラン：${d.get('plan')}\nチェックイン：${d.get('checkin')}\n宿泊：${d.get('nights')}\n人数：大人 ${d.get('adults')}名・子ども ${d.get('children')}名\nお名前：${d.get('guest')}\nメール：${d.get('email')}\nご希望：${d.get('message')||'なし'}`;form.hidden=true;result.hidden=false;});
document.querySelector('#edit').addEventListener('click',()=>{result.hidden=true;form.hidden=false;});
modal.addEventListener('close',()=>{result.hidden=true;form.hidden=false;});
</script></body></html>
